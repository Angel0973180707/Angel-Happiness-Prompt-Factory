<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幸福生態圈 AI 控制台 v4.5</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Happiness Ecosystem AI OS</p>
      <h1>幸福生態圈 AI 控制台 v4.5</h1>
      <p>故事 → YouTube 長影片 → Shorts → 圖文素材 → 多平台導流。</p>
    </header>

    <section class="panel">
      <h2>① 系統設定</h2>

      <label>GAS Web App URL</label>
      <input id="gasUrl" placeholder="貼上 GAS 部署網址 /exec" />

      <div class="grid">
        <button id="saveConfigBtn">儲存設定</button>
        <button id="testBtn" class="secondary">測試連線</button>
        <button id="loadSeriesBtn" class="secondary">讀取故事</button>
      </div>

      <p id="statusText" class="status">尚未連線</p>
    </section>

    <section class="panel">
      <h2>② 選擇故事</h2>

      <label>故事素材</label>
      <select id="storySelect">
        <option value="">請先讀取故事</option>
      </select>

      <div class="grid">
        <button id="generateAllBtn">生成內容宇宙</button>
      </div>
    </section>

    <section class="panel result">
      <h2>③ 生成結果</h2>
      <div id="output" class="empty">尚未生成內容</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
