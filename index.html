<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>幸福產圖指令工廠</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="app">

  <div class="left card">

    <h1>☀ 幸福產圖指令工廠</h1>

    <label>主題宇宙</label>
    <select id="unit">
      <option>幸福旅居</option>
      <option>生活感悟</option>
      <option>幸福教養</option>
      <option>幸福緣手作</option>
      <option>健康頻率生活好物</option>
      <option>智慧名片商業系</option>
    </select>

    <label>系列</label>
    <input id="series" placeholder="例如：早安圖">

    <label>主題</label>
    <input id="topic" placeholder="例如：海邊晨光早餐">

    <label>內容類型</label>
    <select id="contentType">
      <option>POSTER_SINGLE</option>
      <option>INFO_STORY_BOARD</option>
      <option>EVENT_POSTER</option>
      <option>PRODUCT_POSTER</option>
      <option>RECIPE_BOARD</option>
      <option>SHORTS_POSTER</option>
    </select>

    <label>指令分類</label>
    <select id="promptType">
      <option>VISUAL_PROMPT</option>
      <option>SHORT_VIDEO_PROMPT</option>
      <option>SERIES_EXPANSION</option>
      <option>TOPIC_GENERATION</option>
      <option>PLATFORM_COPY</option>
    </select>

    <label>比例</label>
    <select id="ratio">
      <option>9:16</option>
      <option>1:1</option>
      <option>4:5</option>
      <option>16:9</option>
    </select>

    <label>短影音秒數</label>
    <select id="duration">
      <option>20</option>
      <option>30</option>
      <option>40</option>
    </select>

    <label>補充靈感</label>
    <textarea id="extra"></textarea>

    <button onclick="generatePrompt()">生成指令</button>

  </div>

  <div class="middle card">

    <h2>AI 指令</h2>

    <div id="output"></div>

    <button onclick="copyPrompt()">複製 Prompt</button>

  </div>

  <div class="right card">

    <h2>內容回填</h2>

    <input id="driveLink" placeholder="Google Drive 連結">

    <button onclick="saveVisualContent()">儲存視覺內容</button>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
